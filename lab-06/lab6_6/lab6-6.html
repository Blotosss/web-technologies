<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №6 - Завдання 6 (Попап)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <a href="#mail" class="top-bar-link" tabindex="0">Mail</a>
        <a href="#images" class="top-bar-link" tabindex="0">Images</a>

        <div class="popup-wrapper">
            <input type="checkbox" id="popup-toggle" class="popup-toggle-input" aria-label="Відкрити меню додатків">
            <label for="popup-toggle" class="popup-button" title="Додатки Google">
                <span class="grid-icon">
                    <span class="grid-dot"></span>
                    <span class="grid-dot"></span>
                    <span class="grid-dot"></span>
                    <span class="grid-dot"></span>
                    <span class="grid-dot"></span>
                    <span class="grid-dot"></span>
                    <span class="grid-dot"></span>
                    <span class="grid-dot"></span>
                    <span class="grid-dot"></span>
                </span>
            </label>

            <input type="checkbox" id="more-toggle" class="more-toggle-input" aria-label="Показати більше додатків">

            <div class="popup-box" tabindex="0">
                <div class="popup-arrow"></div>

                <div class="popup-scroll-container" tabindex="0">
                    <div class="popup-grid">
                        <a href="#calendar" class="popup-item" tabindex="0">
                            <span class="popup-icon-box">
                                <svg class="popup-svg" viewBox="0 0 48 48">
                                    <rect x="6" y="10" width="36" height="32" rx="4" fill="#4285F4"/>
                                    <rect x="6" y="10" width="36" height="10" rx="4" fill="#1976D2"/>
                                    <circle cx="16" cy="27" r="3" fill="#fff"/>
                                    <circle cx="24" cy="27" r="3" fill="#fff"/>
                                    <circle cx="32" cy="27" r="3" fill="#fff"/>
                                    <circle cx="16" cy="35" r="3" fill="#fff"/>
                                    <circle cx="24" cy="35" r="3" fill="#fff"/>
                                    <circle cx="32" cy="35" r="3" fill="#fff"/>
                                </svg>
                            </span>
                            <span class="popup-label">Calendar</span>
                        </a>

                        <a href="#mail" class="popup-item" tabindex="0">
                            <span class="popup-icon-box">
                                <svg class="popup-svg" viewBox="0 0 48 48">
                                    <rect x="6" y="12" width="36" height="26" rx="3" fill="#EA4335"/>
                                    <polygon points="6,12 24,26 42,12" fill="#fff" opacity="0.9"/>
                                    <polygon points="6,38 24,24 42,38" fill="#D93025"/>
                                </svg>
                            </span>
                            <span class="popup-label">Mail</span>
                        </a>

                        <a href="#news" class="popup-item" tabindex="0">
                            <span class="popup-icon-box">
                                <svg class="popup-svg" viewBox="0 0 48 48">
                                    <rect x="8" y="10" width="32" height="28" rx="2" fill="#5C6BC0"/>
                                    <rect x="12" y="14" width="12" height="10" fill="#fff"/>
                                    <rect x="26" y="14" width="10" height="3" fill="#fff"/>
                                    <rect x="26" y="19" width="10" height="3" fill="#fff"/>
                                    <rect x="12" y="27" width="24" height="3" fill="#fff"/>
                                    <rect x="12" y="32" width="18" height="3" fill="#fff"/>
                                </svg>
                            </span>
                            <span class="popup-label">News</span>
                        </a>

                        <a href="#map" class="popup-item" tabindex="0">
                            <span class="popup-icon-box">
                                <svg class="popup-svg" viewBox="0 0 48 48">
                                    <polygon points="8,10 18,6 30,12 40,8 40,38 30,42 18,36 8,40" fill="#81C784"/>
                                    <path d="M24,12 C20.7,12 18,14.7 18,18 C18,22.5 24,30 24,30 C24,30 30,22.5 30,18 C30,14.7 27.3,12 24,12 Z" fill="#EA4335"/>
                                    <circle cx="24" cy="18" r="3" fill="#fff"/>
                                </svg>
                            </span>
                            <span class="popup-label">Map</span>
                        </a>

                        <a href="#files" class="popup-item" tabindex="0">
                            <span class="popup-icon-box">
                                <svg class="popup-svg" viewBox="0 0 48 48">
                                    <path d="M8,12 L20,12 L24,16 L40,16 C41.1,16 42,16.9 42,18 L42,36 C42,37.1 41.1,38 40,38 L8,38 C6.9,38 6,37.1 6,36 L6,14 C6,12.9 6.9,12 8,12 Z" fill="#FBBC05"/>
                                </svg>
                            </span>
                            <span class="popup-label">Files</span>
                        </a>

                        <a href="#contacts" class="popup-item" tabindex="0">
                            <span class="popup-icon-box">
                                <svg class="popup-svg" viewBox="0 0 48 48">
                                    <rect x="10" y="8" width="28" height="32" rx="4" fill="#34A853"/>
                                    <circle cx="24" cy="20" r="5" fill="#fff"/>
                                    <path d="M16,32 C16,28 20,27 24,27 C28,27 32,28 32,32" fill="#fff"/>
                                </svg>
                            </span>
                            <span class="popup-label">Contacts</span>
                        </a>

                        <div class="popup-extra-group">
                            <a href="#translate" class="popup-item" tabindex="0">
                                <span class="popup-icon-box">
                                    <svg class="popup-svg" viewBox="0 0 48 48">
                                        <rect x="6" y="10" width="22" height="22" rx="3" fill="#4285F4"/>
                                        <text x="11" y="27" fill="#fff" font-size="16" font-weight="bold">A</text>
                                        <rect x="20" y="18" width="22" height="22" rx="3" fill="#34A853"/>
                                        <text x="25" y="35" fill="#fff" font-size="14" font-weight="bold">文</text>
                                    </svg>
                                </span>
                                <span class="popup-label">Translate</span>
                            </a>

                            <a href="#videos" class="popup-item" tabindex="0">
                                <span class="popup-icon-box">
                                    <svg class="popup-svg" viewBox="0 0 48 48">
                                        <circle cx="24" cy="24" r="18" fill="#EA4335"/>
                                        <polygon points="20,16 32,24 20,32" fill="#fff"/>
                                    </svg>
                                </span>
                                <span class="popup-label">Videos</span>
                            </a>

                            <a href="#search" class="popup-item" tabindex="0">
                                <span class="popup-icon-box">
                                    <svg class="popup-svg" viewBox="0 0 48 48">
                                        <rect x="8" y="14" width="32" height="20" rx="3" fill="#4285F4"/>
                                        <text x="13" y="29" fill="#fff" font-size="12" font-weight="bold">GO!</text>
                                    </svg>
                                </span>
                                <span class="popup-label">Search</span>
                            </a>

                            <a href="#photos" class="popup-item" tabindex="0">
                                <span class="popup-icon-box">
                                    <svg class="popup-svg" viewBox="0 0 48 48">
                                        <rect x="8" y="10" width="32" height="28" rx="3" fill="#FBBC05"/>
                                        <circle cx="17" cy="19" r="4" fill="#EA4335"/>
                                        <polygon points="12,34 22,22 28,29 36,18 40,34" fill="#4285F4"/>
                                    </svg>
                                </span>
                                <span class="popup-label">Photos</span>
                            </a>

                            <a href="#apps" class="popup-item" tabindex="0">
                                <span class="popup-icon-box">
                                    <svg class="popup-svg" viewBox="0 0 48 48">
                                        <circle cx="24" cy="24" r="18" fill="#4285F4"/>
                                        <circle cx="24" cy="24" r="9" fill="#FBBC05"/>
                                        <circle cx="24" cy="24" r="5" fill="#34A853"/>
                                    </svg>
                                </span>
                                <span class="popup-label">Apps</span>
                            </a>

                            <a href="#documents" class="popup-item" tabindex="0">
                                <span class="popup-icon-box">
                                    <svg class="popup-svg" viewBox="0 0 48 48">
                                        <rect x="10" y="8" width="28" height="32" rx="3" fill="#4285F4"/>
                                        <polygon points="26,8 38,20 26,20" fill="#BBDEFB"/>
                                        <line x1="16" y1="26" x2="32" y2="26" stroke="#fff" stroke-width="2"/>
                                        <line x1="16" y1="32" x2="28" y2="32" stroke="#fff" stroke-width="2"/>
                                    </svg>
                                </span>
                                <span class="popup-label">Documents</span>
                            </a>

                            <a href="#chat" class="popup-item" tabindex="0">
                                <span class="popup-icon-box">
                                    <svg class="popup-svg" viewBox="0 0 48 48">
                                        <circle cx="24" cy="24" r="16" fill="#34A853"/>
                                        <circle cx="18" cy="22" r="2" fill="#fff"/>
                                        <circle cx="30" cy="22" r="2" fill="#fff"/>
                                        <path d="M18,28 Q24,34 30,28" stroke="#fff" stroke-width="2" fill="none"/>
                                    </svg>
                                </span>
                                <span class="popup-label">Chat</span>
                            </a>

                            <a href="#classroom" class="popup-item" tabindex="0">
                                <span class="popup-icon-box">
                                    <svg class="popup-svg" viewBox="0 0 48 48">
                                        <rect x="8" y="12" width="32" height="24" rx="3" fill="#137333"/>
                                        <rect x="12" y="16" width="24" height="16" fill="#0d5625"/>
                                        <text x="14" y="29" fill="#fff" font-size="10">1+1=2</text>
                                    </svg>
                                </span>
                                <span class="popup-label">Classroom</span>
                            </a>

                            <a href="#collection" class="popup-item" tabindex="0">
                                <span class="popup-icon-box">
                                    <svg class="popup-svg" viewBox="0 0 48 48">
                                        <rect x="10" y="10" width="28" height="28" rx="4" fill="#1A73E8"/>
                                        <polygon points="24,14 26,21 34,21 27,26 30,34 24,29 18,34 21,26 14,21 22,21" fill="#fff"/>
                                    </svg>
                                </span>
                                <span class="popup-label">Collection</span>
                            </a>
                        </div>
                    </div>

                    <div class="popup-footer">
                        <label for="more-toggle" class="popup-more-button" tabindex="0">More</label>
                        <div class="popup-extra-footer">
                            <a href="#even-more" class="even-more-link" tabindex="0">Even more from Google</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button class="notification-btn" title="Сповіщення" tabindex="0">
            <svg class="icon-bell" viewBox="0 0 24 24" width="20" height="20">
                <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="#5f6368"/>
            </svg>
        </button>

        <a href="#profile" class="user-avatar" title="Акаунт" tabindex="0">
            <span class="avatar-circle">U</span>
        </a>
    </header>

</body>
</html>
