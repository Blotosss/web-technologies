<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №6 - Завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-wrapper">
        <div class="weather-card">
            <div class="card-bg"></div>

            <div class="nav-controls">
                <button class="nav-btn prev-btn" title="Попередній">&#8592;</button>
                <div class="divider"></div>
                <button class="nav-btn next-btn" title="Наступний">&#8594;</button>
            </div>

            <div class="main-temp">17</div>

            <div class="forecast-bar">
                <div class="forecast-col">
                    <span class="day-name">Mon</span>
                    <span class="day-temp">17°</span>
                </div>
                <div class="forecast-col">
                    <span class="day-name">Tue</span>
                    <span class="day-temp">19°</span>
                </div>
                <div class="forecast-col">
                    <span class="day-name">Wed</span>
                    <span class="day-temp">16°</span>
                </div>
                <div class="forecast-col">
                    <span class="day-name">Thu</span>
                    <span class="day-temp">18°</span>
                </div>
                <div class="forecast-col">
                    <span class="day-name">Fri</span>
                    <span class="day-temp">21°</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
