<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №5 - Завдання 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="travel-planner">
    <h1 class="planner-title">План подорожі:</h1>

    <ul class="stages-list">
        <li class="stage-item">
            <span class="stage-name">Підготовчий етап</span>
            <ul class="tasks-list">
                <li class="task-item"><span class="task-name" style="width: 55%;">Обрати маршрут</span></li>
                <li class="task-item"><span class="task-name" style="width: 50%;">Квитки на літак</span></li>
                <li class="task-item"><span class="task-name" style="width: 30%;">Готель</span></li>
                <li class="task-item"><span class="task-name" style="width: 45%;">Оренда авто</span></li>
            </ul>
        </li>

        <li class="stage-item">
            <span class="stage-name">Відпочинок</span>
            <ul class="tasks-list">
                <li class="task-item"><span class="task-name" style="width: 35%;">Бари</span></li>
                <li class="task-item"><span class="task-name" style="width: 35%;">Казино</span></li>
                <li class="task-item"><span class="task-name" style="width: 30%;">Музеї</span></li>
                <li class="task-item"><span class="task-name" style="width: 50%;">Фестивалі</span></li>
            </ul>
        </li>
    </ul>
</div>

</body>
</html>
